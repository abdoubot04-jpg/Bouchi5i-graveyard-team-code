services:
  - type: web
    name: team-task-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false
      - key: MAX_ACTIVE_TEAMS
        value: "20"
      - key: TICK_SECONDS
        value: "2"
